name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: shell syntax and shellcheck
        run: |
          files="bin/worker-stats hooks/*.sh verify-templates/*.sh"
          for f in $files; do bash -n "$f"; done
          shellcheck -S error $files
      - name: settings-snippet.json is valid JSON
        run: python3 -m json.tool settings-snippet.json >/dev/null
      - name: agents and skills have name and description
        run: |
          for f in agents/*.md skills/*/SKILL.md; do
            head -6 "$f" | grep -q '^name:' && head -6 "$f" | grep -q '^description:' || { echo "missing frontmatter: $f"; exit 1; }
          done
